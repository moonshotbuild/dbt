model.test.c:
- sequence: 0
  type: execute
  sql: DROP SCHEMA IF EXISTS adapters_postgres_get_missing_columns CASCADE
- sequence: 1
  type: execute
  sql: CREATE SCHEMA adapters_postgres_get_missing_columns
- sequence: 2
  type: execute
  sql: CREATE TABLE adapters_postgres_get_missing_columns.a (one int, three int)
- sequence: 3
  type: execute
  sql: CREATE TABLE adapters_postgres_get_missing_columns.b (one int, two int)
- sequence: 4
  type: execute
  sql: |-
    select
    column_name,
    data_type,
    character_maximum_length,
    numeric_precision,
    numeric_scale
    
    from postgres.INFORMATION_SCHEMA.columns
    where table_name = 'a'
    
    and table_schema = 'adapters_postgres_get_missing_columns'
    
    order by ordinal_position
- sequence: 5
  type: execute
  sql: |-
    select
    column_name,
    data_type,
    character_maximum_length,
    numeric_precision,
    numeric_scale
    
    from postgres.INFORMATION_SCHEMA.columns
    where table_name = 'b'
    
    and table_schema = 'adapters_postgres_get_missing_columns'
    
    order by ordinal_position
