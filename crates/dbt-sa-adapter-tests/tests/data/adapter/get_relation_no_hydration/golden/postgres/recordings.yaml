abd2acea:
- sequence: 0
  type: execute
  sql: CREATE SCHEMA adapters_postgres_relation_no_hydration
b65fb988:
- sequence: 0
  type: execute
  sql: |-
    with relation as (
    select
    pg_class.oid as relation_id,
    pg_class.relname as relation_name,
    pg_class.relnamespace as schema_id,
    pg_namespace.nspname as schema_name
    from pg_class
    join pg_namespace
    on pg_class.relnamespace = pg_namespace.oid
    where pg_namespace.nspname != 'information_schema'
    and pg_namespace.nspname not like 'pg\_%'
    ),
    dependency as (
    select distinct
    coalesce(pg_rewrite.ev_class, pg_depend.objid) as dep_relation_id,
    pg_depend.refobjid as ref_relation_id
    from pg_depend
    left join pg_rewrite
    on pg_depend.objid = pg_rewrite.oid
    where coalesce(pg_rewrite.ev_class, pg_depend.objid) != pg_depend.refobjid
    )
    select distinct
    dep.schema_name as dependent_schema,
    dep.relation_name as dependent_name,
    ref.schema_name as referenced_schema,
    ref.relation_name as referenced_name
    from dependency
    join relation ref
    on dependency.ref_relation_id = ref.relation_id
    join relation dep
    on dependency.dep_relation_id = dep.relation_id
d5a60b93:
- sequence: 0
  type: execute
  sql: CREATE TABLE adapters_postgres_relation_no_hydration.a_2 (val int)
e77966e3:
- sequence: 0
  type: execute
  sql: |-
    select tablename as name, schemaname as schema, 'table' as type
    from pg_catalog.pg_tables where lower(schemaname) = lower('adapters_postgres_relation_no_hydration')
    union all
    select viewname, schemaname, 'view'
    from pg_catalog.pg_views where lower(schemaname) = lower('adapters_postgres_relation_no_hydration')
    union all
    select matviewname, schemaname, 'materialized_view'
    from pg_catalog.pg_matviews where lower(schemaname) = lower('adapters_postgres_relation_no_hydration')
fc3b6e60:
- sequence: 0
  type: execute
  sql: DROP SCHEMA IF EXISTS adapters_postgres_relation_no_hydration CASCADE
