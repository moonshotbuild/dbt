kind: Security
body: Refuse a `packages-install-path` (from `dbt_project.yml` or the command line)
    that is absolute or resolves outside the project. `dbt deps` deletes what is in
    that directory when it reinstalls, so `../OUTSIDE` emptied an arbitrary
    directory.
