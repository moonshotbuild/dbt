kind: Security
body: Refuse to stage a local or Hub package whose name is not a single
    directory name. The name was joined onto the staging dir before `dbt deps`
    checked it, so an absolute or `..` name wrote the package (a symlink or an
    extracted tarball) anywhere on the machine.
